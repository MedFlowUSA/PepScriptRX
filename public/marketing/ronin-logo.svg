<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Ronin logo</title>
  <desc id="desc">Minimal Ronin wordmark with red rising sun and silver blade mark.</desc>
  <defs>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>
  <g fill="none" filter="url(#shadow)">
    <path d="M143 60a84 84 0 0 1 168 0" stroke="url(#red)" stroke-width="18" stroke-linecap="round"/>
    <path d="M226 22v145" stroke="url(#silver)" stroke-width="10" stroke-linecap="round"/>
    <path d="M156 173h140" stroke="url(#silver)" stroke-width="10" stroke-linecap="round"/>
    <path d="M186 132c28 22 56 22 84 0" stroke="url(#red)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="340" y="127" fill="url(#silver)" font-family="Arial Black, Montserrat, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="10">RONIN</text>
  <text x="345" y="172" fill="#ef4444" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="9">DISCIPLINE • RECOVERY • PRECISION</text>
  <path d="M342 190h294" stroke="#e2e8f0" stroke-width="3" opacity=".48"/>
</svg>
