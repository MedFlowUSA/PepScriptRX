<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Ronin product vial</title>
  <desc id="desc">Premium dark Ronin vial placeholder for catalog products.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".42"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#94a3b8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="520" height="520" fill="none"/>
  <circle cx="260" cy="260" r="230" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <path d="M196 130h128v48c0 17-13 30-30 30h-68c-17 0-30-13-30-30z" fill="#111827" stroke="#e2e8f0" stroke-width="8"/>
    <rect x="170" y="198" width="180" height="230" rx="42" fill="url(#glass)" stroke="#e2e8f0" stroke-width="8"/>
    <rect x="194" y="238" width="132" height="126" rx="12" fill="#07080b" stroke="#ef4444" stroke-width="4"/>
    <path d="M260 110v292" stroke="#ffffff" stroke-width="4" opacity=".28"/>
    <path d="M214 330h92" stroke="url(#red)" stroke-width="8" stroke-linecap="round"/>
    <path d="M260 244l-40 76h80z" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linejoin="round"/>
    <path d="M260 244v76" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <text x="260" y="384" text-anchor="middle" fill="#f8fafc" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="4">RONIN</text>
  </g>
